# QuarterSmart: Netlify continuous deployment from GitHub.
# On every push to main, Netlify runs the build (which copies only the
# publishable site into dist/) and publishes dist/.

[build]
  command = "node netlify-build.mjs"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# Serverless functions (source stays out of dist/). insert-coin.mjs serves
# /insert-coin/api/slots, /insert-coin/api/book and /insert-coin/calendar
# (routes are set in the file's own config). The booking server's address
# lives only in the CAL_ORIGIN environment variable, never in this repo or
# in any redirect: no rule here may point at it.
[functions]
  directory = "netlify/functions"

# Gift images for the speed-to-lead outreach (one per prospect, linked only from that prospect's email).
# Unlisted: never indexed, never in the sitemap (PNGs aren't pages), and robots.txt disallows /g/.
[[headers]]
  for = "/g/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow, noimageindex"
    Cache-Control = "public, max-age=31536000, immutable"

# Long-cache the immutable media (frame sequences, video, images, logos).
# This also covers /assets/img/* (page art) and /assets/og/* (social cards);
# Netlify sets their Content-Type from the file extension.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/logos/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Baseline security headers (no CSP, to avoid breaking fonts/embeds)
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# Long-cache the self-hosted fonts
[[headers]]
  for = "/assets/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Correct content-type for the web app manifest (Netlify defaults to octet-stream)
[[headers]]
  for = "/site.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"

