# 2026 relaunch: short links and retired page names
# Booking lives at /insert-coin: the page (insert-coin/index.html) plus the
# insert-coin function, which also answers /insert-coin/calendar with a 302
# to the public calendar page on book.quartersmart.com (our proxy domain).
# No redirect rules for those paths: when merging main, drop its stopgap
# /insert-coin and /insert-coin/calendar rules. /book is an alias; 302 so
# the target can change.
[[redirects]]
  from = "/book"
  to = "/insert-coin/"
  status = 302
[[redirects]]
  from = "/offers"
  to = "/services/"
  status = 301
[[redirects]]
